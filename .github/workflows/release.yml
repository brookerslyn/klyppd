name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run electron:build

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp release/*.deb dist/ 2>/dev/null || true
          cp release/*.AppImage dist/ 2>/dev/null || true
          cp release/*.rpm dist/ 2>/dev/null || true
          ls dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
